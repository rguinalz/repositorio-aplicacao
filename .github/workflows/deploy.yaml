name: Pipeline CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  job1:
    name: build_ecr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::773709398396:role/GithubActionsRepoApp
          aws-region: us-east-2

      - name: Amazon ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          docker build -t meu-website:v1.0 .
          docker tag meu-website:v1.0 773709398396.dkr.ecr.us-east-2.amazonaws.com/site_prod:v1.0
          docker push 773709398396.dkr.ecr.us-east-2.amazonaws.com/site_prod:v1.0

  job2:
    name: deploy_ec2
    runs-on: ubuntu-latest
    needs: job1   # ✅ garante que só roda depois do build
    steps:
      - name: Deploy EC2 via SSH
        run: |
          ssh -i chave-site-pro.pem ec2-user@18.223.134.219 "docker pull 773709398396.dkr.ecr.us-east-2.amazonaws.com/site_prod:v1.0 && docker run -d -p 80:80 773709398396.dkr.ecr.us-east-2.amazonaws.com/site_prod:v1.0"
